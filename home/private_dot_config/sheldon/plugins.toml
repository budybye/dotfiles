# ~/.config/sheldon/plugins.toml
shell = "zsh"

# 遅延読み込み
[plugins.zsh-defer]
github = "romkatv/zsh-defer"
apply = ["source"]

# 遅延読み込みのテンプレート apply で defer を使用する
[templates]
apply = "defer"
defer = "{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}"
PATH = 'export PATH="$PATH:{{ dir }}"'

# 補完。zshrc が早い段階で `compinit -C`（compdef を使えるようにするための早期呼び出し）を実行する。
# こちらは fpath（zsh-completions など）が出そろった後に zsh-defer で再度 compinit して補完定義を取り込む。
# 2 回呼ぶのは意図した仕様
[plugins.compinit]
inline = "autoload -Uz compinit && zsh-defer compinit -d \"${XDG_CACHE_HOME:-$HOME/.cache}/zsh/zcompdump-${ZSH_VERSION}\""

# 高速版シンタックスハイライト
[plugins.zsh-fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
apply = ["defer"]

# 補完
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir = "src"
apply = ["fpath"]

# コマンド履歴
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]
apply = ["defer"]

# 非同期
[plugins.async]
github = "mafredri/zsh-async"
use = ["{{ name }}.zsh"]
apply = ["defer"]

# cd
[plugins.autojump]
github = "wting/autojump"
dir = "bin"
apply = ["PATH", "defer"]

# z の代わり
[plugins.zsh-z]
github = "agkozak/zsh-z"
apply = ["defer"]

# 略語展開
[plugins.zsh-abbr]
github = "olets/zsh-abbr"
apply = ["defer"]

# ナビゲーションツール n-cd
[plugins.zsh-navigation-tools]
github = "z-shell/zsh-navigation-tools"
apply = ["defer"]

# vim モード。`bindkey -v` で viins の Ctrl-R / 上矢印を上書きするので、
# キーバインドを足す fzf・atuin より先に読み込む（defer は記述順に実行される）
[plugins.zsh-vim-mode]
github = "softmoth/zsh-vim-mode"
apply = ["defer"]

# ファイル検索 補完 インストール要
[plugins.fzf]
github = "junegunn/fzf"
use = ["shell/key-bindings.zsh", "shell/completion.zsh"]
apply = ["defer"]

# fzf は Ctrl-R を atuin に任せる（.zshrc で FZF_CTRL_R_COMMAND を空にしている）。Ctrl-T / Alt-C は fzf のまま
# vim-mode が viins を上書きした後で atuin のキーを張り直す。ウィジェット名は `atuin init zsh` のもの
[plugins.atuin-keys]
inline = """
if (( $+widgets[atuin-search-viins] )); then
  zsh-defer -c "bindkey -M viins '^R' atuin-search-viins; bindkey -M viins '^[[A' atuin-up-search-viins; bindkey -M viins '^[OA' atuin-up-search-viins; bindkey -M emacs '^R' atuin-search"
fi
"""

# 括弧補完
[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"
apply = ["defer"]

# npm グローバルインストール履歴
[plugins.zsh-npm-global-recorder]
github = "yanskun/zsh-npm-global-recorder"
apply = ["defer"]

# マルチツール fzf deno 必須
[plugins.zeno]
github = "yuki-yano/zeno.zsh"
use = ["{{ name }}.zsh"]
apply = ["defer"]

# fzf で git 操作
[plugins.forgit]
github = "wfxr/forgit"
apply = ["defer"]

# git を開く
[plugins.git-open]
github = "paulirish/git-open"
apply = ["defer"]

[plugins.enhancd]
github = 'b4b4r07/enhancd'
use=["init.sh"]
apply = ["defer"]

[plugins.blackbox]
github = "StackExchange/blackbox"
apply = ["defer"]

# 翻訳
[plugins.translate-shell]
github = "soimort/translate-shell"
use = ["translate-shell.plugin.zsh"]
apply = ["defer"]