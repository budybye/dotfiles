setupVersion: 2
modelRoles:
  task: openai-codex/gpt-5.6-luna:high
  default: standard-compute/standard-compute
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
  maxRetries: 3
theme:
  dark: dark-monokai
  light: titanium
composer:
  shape: box
retry:
  fallbackChains:
    default:
      - opencode-zen/deepseek-v4-flash-free
      - openai-codex/gpt-5.6-luna
      - cursor/composer-2.5
      - sakura/preview/Kimi-K2.7-Code
memory:
  backend: mnemopi
  mnemopi:
    - scoping: per-project
    - noEmbeddings: true
    - llmMode: none