setupVersion: 2
modelRoles:
  default: opencode-go/glm-5.3-flash
  slow: openai-codex/gpt-5.6-luna:max
  advisor: cursor/cursor-grok-4.6:auto
  vision: openai-codex/gpt-5.6-luna:medium
  commit: openai-codex/gpt-5.6-luna:medium
  task: openai-codex/gpt-5.6-luna:medium
  tiny: openai-codex/gpt-5.6-luna:low
  smol: openai-codex/gpt-5.6-luna:low
  plan: cursor/cursor-grok-4.6:auto
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
  maxRetries: 3
theme:
  dark: dark-monokai
  light: titanium
composer:
  shape: box
retry:
  fallbackChains:
    default:
      - cursor/composer-2.5
ttsr:
  builtinRules: false
vault:
  enabled: true
memory:
  backend: mnemopi
  mnemopi:
    - scoping: per-project
    - noEmbeddings: true
    - llmMode: none