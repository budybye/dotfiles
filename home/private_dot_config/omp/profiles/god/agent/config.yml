setupVersion: 2
modelRoles:
  smol: "@default"
  tiny: "@default"
  commit: "@default"
  judge: cloudflare-workers-ai/@cf/cloudflare/clef
  vision: "@default"
  task: "@default"
  designer: "@default"
  plan: "@default"
  slow: "@default"
  advisor: anthropic/claude-opus-5-5
  default: anthropic/claude-sonnet-5-5
defaultThinkingLevel: auto
advisor:
  enabled: true
  reviewMode: agent-end
magicKeywords:
  enabled: true
autoLearn:
  enabled: true
vault:
  enabled: true
dev:
  autoqaConsent: denied
read:
  defaultLimit: 1000
ttsr:
  builtinRules: false
compaction:
  enabled: true
  thresholdPercent: 42
composer:
  shape: box
theme:
  dark: dark-monokai
  light: titanium
browser:
  headless: true
goal:
  statusInFooter: true
memory:
  backend: mnemopi
mnemopi:
  noEmbeddings: true
  llmMode: none
providers:
  anthropic:
    slowMode: auto
    serverSideFallback: true
retry:
  usageAwareFallback: false
  fallbackChains:
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5-5
    anthropic/claude-opus-5-5:
      - anthropic/claude-sonnet-5-5
    anthropic/claude-sonnet-5-5:
      - anthropic/claude-haiku-5-5
task:
  agentModelOverrides:
    scout: "@default"
    sonic: "@default"
    reviewer: anthropic/claude-opus-5-5
    security-reviewer: anthropic/claude-opus-5-5