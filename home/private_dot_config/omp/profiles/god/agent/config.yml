setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-luna
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
  maxRetries: 3
theme:
  dark: dark-monokai
  light: titanium
composer:
  shape: box
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-luna
      - cursor/composer-2.5
      - sakura/preview/Kimi-K2.7-Code
      - openrouter/deepseek/deepseek-v4-flash:free
      - openrouter/z-ai/glm-5.2:free
      - opencode-zen/deepseek-v4-flash-free
      - cloudflare-ai-gateway/workers-ai/@cf/moonshotai/kimi-k2.7-code
      - google-ai-studio/gemini-3.5-flash
memory:
  backend: mnemopi
  mnemopi:
    - scoping: per-project
    - noEmbeddings: true
    - llmMode: none