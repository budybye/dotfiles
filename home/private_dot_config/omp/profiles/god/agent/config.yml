setupVersion: 2
modelRoles:
  smol: "@default"
  tiny: "@default"
  plan: "@default"
  slow: "@default"
  commit: "@default"
  vision: standard-compute/standardcompute:auto
  designer: standard-compute/standardcompute:high
  task: standard-compute/standardcompute:medium
  advisor: standard-compute/standardcompute:low
  default: standard-compute/standardcompute
defaultThinkingLevel: auto
advisor:
  enabled: true
magicKeywords:
  enabled: true
dev:
  autoqaConsent: denied
theme:
  dark: dark-monokai
  light: titanium
composer:
  shape: box
# retry:
#   enabled: true
#   maxRetries: 2
#   maxDelayMs: 654321
memory:
  backend: mnemopi
  mnemopi:
    - scoping: per-project
    - noEmbeddings: true
    - llmMode: none
ttsr:
  builtinRules: false
vault:
  enabled: true
compaction:
  enabled: false
  threshold: 0.8
autoLearn:
  enabled: true