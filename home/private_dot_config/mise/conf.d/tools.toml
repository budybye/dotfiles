# mise tools — 実装言語ブロック単位で管理。
# 各ブロック末尾に github: を置く（GitHub primary language / mise backend 基準）。
# 例外: uv/ruff は実装が Rust でも Python エコシステムとして Python ブロックへ。
# コメントアウト行も意図的に残している（再有効化用）。

[tools]
# https://mise.jdx.dev/dev-tools/backends/http.html
# "http:android-cli" = "latest"
# "http:grok" = "latest"

# coderabbit CLI（非 OSS・GitHub release なし）。公式 install.sh の代替で、版は releases/latest/VERSION から解決する。
# SHA256SUMS は行頭が "./" 付きで checksum_url だけでは照合できないため checksum_expr で抜き出す。
# 照合は lockfile（`mise lock --global`）がある時だけ。SHA256SUMS.sig の署名検証は mise に無い。
"http:coderabbit".version = "latest"
"http:coderabbit".url = 'https://cli.coderabbit.ai/releases/{{ version }}/coderabbit-{{ os(macos="darwin") }}-{{ arch() }}.zip'
"http:coderabbit".version_list_url = "https://cli.coderabbit.ai/releases/latest/VERSION"
"http:coderabbit".checksum_url = 'https://cli.coderabbit.ai/releases/{{ version }}/SHA256SUMS'
"http:coderabbit".checksum_expr = '"sha256:" + split(filter(split(body, "\n"), # endsWith("  ./" + filename))[0], " ")[0]'

# cursor CLI（agent）。公式 install.sh の代替。VERSION ファイルが無いので版は install.sh 内の lab/<版>/ から正規表現で取る。
# 展開直下に同梱の node / rg があり、そのままだと mise の node / rg を PATH で奪うため、bin/ に agent と cursor-agent の symlink だけ作って公開する。
# checksum は非公開。`mise lock --global` が計算した値を lockfile で照合する（初回は無検証）。
"http:cursor-cli".version = "latest"
"http:cursor-cli".url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch() }}/agent-cli-package.tar.gz'
"http:cursor-cli".version_list_url = "https://cursor.com/install"
"http:cursor-cli".version_regex = 'lab/(\d{4}\.\d{2}\.\d{2}-[0-9a-f]+)/'
"http:cursor-cli".strip_components = 1
"http:cursor-cli".bin_path = "bin"
"http:cursor-cli".postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sf ../cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent" && ln -sf ../cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/agent"'

