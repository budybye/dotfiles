[settings]
# 相対: 0s / 7d / 6mo / 1y、絶対: 2024-06-01
# 公開から 3d 未満のバージョンは採用しない（供給網リスク緩和）。
minimum_release_age = "3d"
# 自分で管理・即追従したい tool は除外
minimum_release_age_excludes = [
  "github:can1357/oh-my-pi",
  "github:boborder/lazyxrp",
]

# mise.lock を作成する
lockfile = false

# 失敗したインストールの残骸をデバッグ用に保持（旧 always_keep_download は deprecated のため削除）
always_keep_install = false         # デフォルトでは失敗時に削除

# （plugin_autoupdate_last_check_duration は未実装で 2027.10.5 に削除予定のため削除）

# これらのプレフィックスを持つ設定ファイルはデフォルトで信頼される
# ~/dotfiles は ~/.local/share/chezmoi への symlink。実パスも併記する。
trusted_config_paths = [
  '~/dotfiles',
  '~/.local/share/chezmoi',
]

# 慣習的なバージョンファイル（.nvmrc 等）を有効にするツール
# （旧 legacy_version_file / asdf_compat は deprecated・無効のため削除済み）
idiomatic_version_file_enable_tools = [
  "node",
  "python",  # .python-version
  "ruby",    # .ruby-version
  "go",      # .go-version
]
# idiomatic_version_file_disable_tools = ['python']

verbose = false       # true でインストールの全出力。`MISE_VERBOSE`
http_timeout = "30s"  # HTTP タイムアウト。`MISE_HTTP_TIMEOUT`
jobs = 8              # 並行インストール数（デフォルト 4）
raw = false           # true でプラグインを直接 stdin/stdout/stderr にパイプ
yes = true            # すべてのプロンプトに自動で yes

# activate 後に遅延ロード(sheldon defer 等)が PATH を足しても mise の tool を先頭に保つ
activate_aggressive = true

# mise 本体の自動更新（2026.10.7+）
self_update.auto = true
# self_update.check_duration = "7d"

# グローバル tool の自動更新（24h ごと）。minimum_release_age で新着を寝かせてから採用。
tool_update.global_auto = true
# cache_prune_age = "14d"
# gpg_verify = false

#not_found_auto_install = true # `MISE_NOT_FOUND_AUTO_INSTALL`
#task_output = "prefix"
#paranoid = false       # `MISE_PARANOID`
#safe = false           # `MISE_SAFE`（テンプレート exec / hooks を禁止）

# shorthands_file = '~/.config/mise/shorthands.toml'
# disable_default_shorthands = false
# disable_tools = ['rust']

# env_file はグローバルだと config_root=$HOME → ~/.env を探す。
# プロジェクト単位で使うなら各 mise.toml 側に書く。
env_file = '.env'

# auto_env = true

env_conf_d = true

# 実験的機能を有効にする
experimental = true

color_theme = "catppuccin"

age.key_file = "~/.config/mise/age.txt"

# 設定ファイルを持つディレクトリに入るときの表示
status.missing_tools = "if_other_versions_installed"
status.show_env = false
status.show_tools = false

# Rust toolchain は mise core (`rust = "stable"`) + rustup。
# Path は `~` / テンプレを展開しないので絶対パスで XDG に固定。
rust.cargo_home = "~/.local/share/cargo"
rust.rustup_home = "~/.local/share/rustup"

# package manager
cargo.binstall = true
pypi.uvx = true                # 旧 pipx.uvx。pipx: バックエンドを uv で実行
npm.package_manager = "bun"    # 旧 npm.bun。npm: バックエンドを bun で実行

[[env]]
_.path = [
  '~/.local/bin',
  './node_modules/.bin',
]
