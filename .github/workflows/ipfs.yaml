name: Ipfs Pinning
# mainブランチにpushされたら ipfsにピン留めする
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # - name: Checkout
      #   uses: actions/checkout@v6
      #   with:
      #     fetch-depth: 0

      - name: Create bare clone
        run: |
          git clone --mirror https://github.com/budybye/dotfiles.git dotfiles
          cd dotfiles
          git update-server-info
          for pack in objects/pack/*.pack; do
            [ -e "${pack}" ] || continue
            pack_name="${pack##*/}"
            mv "${pack}" .
            git unpack-objects < "${pack_name}"
            rm -f "${pack_name}"
          done
          rm -f objects/pack/*

      - name: Pin to IPFS
        uses: aquiladev/ipfs-action@v1
        id: ipfs
        with:
          path: ./dotfiles
          service: filebase
          pinName: dotfiles
          filebaseBucket: ${{ secrets.FILEBASE_BUCKET }}
          filebaseKey: ${{ secrets.FILEBASE_KEY }}
          filebaseSecret: ${{ secrets.FILEBASE_SECRET }}

      - name: Verify Git clone through IPFS gateway
        env:
          GATEWAY: ${{ secrets.GATEWAY }}
          IPFS_HASH: ${{ steps.ipfs.outputs.hash }}
        run: |
          set -eu
          : "${GATEWAY:?GATEWAY secret is required}"
          : "${IPFS_HASH:?IPFS hash output is required}"
          git clone "https://${GATEWAY}/ipfs/${IPFS_HASH}" /tmp/dotfiles
          test -f /tmp/dotfiles/HEAD
          rm -rf /tmp/dotfiles
