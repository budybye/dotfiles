name: Push to ghcr
# semver tag push または tag.yaml の workflow_dispatch で full/slim/dev image を GHCR 更新。
# main push では起動しない。schedule はイメージを公開せず、GHA cache を更新する。
# full は default GUI image、slim は CLI image、dev は Dev Containers image。
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

  schedule:
    # 日本時間(UTC+9) 16:20 — プラットフォーム別キャッシュの定期更新のみ
    - cron: "20 7 * * *"

concurrency:
  # schedule は main と別グループ — workflow_dispatch / 旧 main push がキャッシュ更新をキャンセルしない
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-cache-refresh' || github.ref }}
  # schedule 以外は同一 ref の並行 run をキャンセル（tag push + workflow_dispatch の二重起動対策）
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  REGISTRY_IMAGE: ghcr.io/budybye/ubuntu-dev
jobs:
  build-images:
    # 3時間
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        flavor:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: slim.Dockerfile
        include:
          # ARM64ビルド用の設定
          - platform: linux/arm64
            runs-on: ubuntu-26.04-arm
          # AMD64ビルド用の設定
          - platform: linux/amd64
            runs-on: ubuntu-26.04
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.description=${{ matrix.flavor.name }} / ${{ matrix.platform }}
          annotations: |
            org.opencontainers.image.source=https://github.com/budybye/ubuntu-dev
            org.opencontainers.image.documentation=https://github.com/budybye/ubuntu-dev/blob/main/README.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4



      - name: Login to GitHub Container Registry
        if: github.event_name != 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/${{ matrix.flavor.dockerfile }}
          build-args: |
            DOTFILES_REF=${{ github.ref_name }}
            DOTFILES_REV=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.flavor.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=min,scope=${{ matrix.flavor.name }}-${{ env.PLATFORM_PAIR }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ github.event_name != 'schedule' }}
          outputs: ${{ github.event_name != 'schedule' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || '' }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Set digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}-${{ matrix.flavor.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-dev:
    # 3時間
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          # ARM64ビルド用の設定
          - platform: linux/arm64
            runs-on: ubuntu-26.04-arm
          # AMD64ビルド用の設定
          - platform: linux/amd64
            runs-on: ubuntu-26.04
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer
        id: devcontainer
        uses: devcontainers/ci@v0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTFILES_REF: ${{ github.ref_name }}
          DOTFILES_REV: ${{ github.sha }}
        with:
          imageName: ${{ env.REGISTRY_IMAGE }}
          imageTag: ${{ env.PLATFORM_PAIR }}-dev
          cacheFrom: ${{ env.REGISTRY_IMAGE }}:${{ env.PLATFORM_PAIR }}-dev
          push: never

      - name: Dev push by digest
        shell: bash
        run: |
          set -o pipefail

          image="${{ env.REGISTRY_IMAGE }}:${{ env.PLATFORM_PAIR }}-dev"
          push_log="$(mktemp)"
          trap 'rm -f "${push_log}"' EXIT

          if ! docker push "${image}" 2>&1 | tee "${push_log}"; then
            echo "Docker push failed for ${image}." >&2
            exit 1
          fi

          digest=""
          while IFS= read -r line; do
            if [[ "${line}" =~ digest:\ sha256:([0-9a-f]{64}) ]]; then
              digest="${BASH_REMATCH[1]}"
            fi
          done < "${push_log}"

          if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Unable to extract image digest for ${image}." >&2
            exit 1
          fi

          printf '%s\n' "${digest}" > /tmp/devcontainer-cache

      - name: Set dev digest
        run: |
          mkdir -p /tmp/digests
          digest="$(cat /tmp/devcontainer-cache)"
          touch "/tmp/digests/${digest}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}-dev
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1


  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    needs:
      - build-images
      - build-dev
    if: github.event_name != 'schedule'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          shopt -s nullglob

          for flavor in full slim dev; do
            digest_files=(digests-*-"${flavor}"/*)
            if [ "${#digest_files[@]}" -eq 0 ]; then
              echo "No digest artifacts found for ${flavor}." >&2
              exit 1
            fi

            refs=()
            for digest_file in "${digest_files[@]}"; do
              refs+=("${{ env.REGISTRY_IMAGE }}@sha256:$(basename "${digest_file}")")
            done

            tags=(-t "${{ env.REGISTRY_IMAGE }}:${flavor}")
            if [ "${flavor}" = "full" ]; then
              tags+=(-t "${{ env.REGISTRY_IMAGE }}:latest")
              while IFS= read -r tag; do
                tags+=(-t "${tag}")
              done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
            fi

            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
            docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${flavor}"
          done
