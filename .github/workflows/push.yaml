name: Push to ghcr
# semver tag push または tag.yaml の workflow_dispatch で full/slim/dev image を GHCR 更新。
# main push では起動しない。schedule はイメージを公開せず、GHA cache を更新する。
# full は default GUI image、slim は CLI image、dev は Dev Containers image。
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

  schedule:
    # 日本時間(UTC+9) 16:20 — プラットフォーム別キャッシュの定期更新のみ
    - cron: "20 7 * * *"

concurrency:
  # schedule は main と別グループ — workflow_dispatch / 旧 main push がキャッシュ更新をキャンセルしない
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-cache-refresh' || github.ref }}
  # schedule 以外は同一 ref の並行 run をキャンセル（tag push + workflow_dispatch の二重起動対策）
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  REGISTRY_IMAGE: ghcr.io/budybye/ubuntu-dev
jobs:
  build:
    # 3時間
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        flavor:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: slim.Dockerfile
          - name: dev
        include:
          # ARM64ビルド用の設定
          - platform: linux/arm64
            runs-on: ubuntu-26.04-arm
          # AMD64ビルド用の設定
          - platform: linux/amd64
            runs-on: ubuntu-26.04
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "ARCH=${platform#linux/}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
      - name: Docker meta
        if: matrix.flavor.name != 'dev'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.description=${{ matrix.flavor.name }} / ${{ matrix.platform }}
          annotations: |
            org.opencontainers.image.source=https://github.com/budybye/ubuntu-dev
            org.opencontainers.image.documentation=https://github.com/budybye/ubuntu-dev/blob/main/README.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build runner の不要な Docker/apt cache だけ削除する。
      # 大量の system package purge は runner 初期化を遅くするため行わない。
      - name: Clean space
        run: |
          df -h
          docker system prune --all --force --volumes || true
          sudo apt-get clean
          df -h


      - name: Login to GitHub Container Registry
        if: github.event_name != 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push by digest
        if: matrix.flavor.name != 'dev'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/${{ matrix.flavor.dockerfile }}
          build-args: |
            DOTFILES_REF=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.flavor.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=min,scope=${{ matrix.flavor.name }}-${{ env.PLATFORM_PAIR }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ github.event_name != 'schedule' }}
          outputs: ${{ github.event_name != 'schedule' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || '' }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Set digest
        if: matrix.flavor.name != 'dev' && github.event_name != 'schedule'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Build devcontainer
        if: matrix.flavor.name == 'dev'
        id: devcontainer
        uses: devcontainers/ci@v0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTFILES_REF: ${{ github.ref_name }}
        with:
          imageName: ${{ env.REGISTRY_IMAGE }}
          imageTag: ${{ env.PLATFORM_PAIR }}-${{ matrix.flavor.name }}
          push: never

      - name: Dev push by digest
        if: matrix.flavor.name == 'dev' && github.event_name != 'schedule'
        run: |
          /usr/bin/docker push "${{ env.REGISTRY_IMAGE }}:${{ env.PLATFORM_PAIR }}-${{ matrix.flavor.name }}" | \
            grep digest | \
            sed -n 's/^.*digest: sha256:\([a-f0-9]*\).*$/\1/p' > /tmp/devcontainer-cache

      - name: Set dev digest
        if: matrix.flavor.name == 'dev' && github.event_name != 'schedule'
        run: |
          mkdir -p /tmp/digests
          digest="$(cat /tmp/devcontainer-cache)"
          touch "/tmp/digests/${digest}"
      - name: Upload digest
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}-${{ matrix.flavor.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1


  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - name: full
          - name: slim
          - name: dev
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.flavor.name }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        if: matrix.flavor.name == 'full'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create full manifest list and push
        if: matrix.flavor.name == 'full'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY_IMAGE }}:full" \
            -t "${{ env.REGISTRY_IMAGE }}:latest" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:full"

      - name: Create slim manifest list and push
        if: matrix.flavor.name == 'slim'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY_IMAGE }}:slim" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:slim"

      - name: Create dev manifest list and push
        if: matrix.flavor.name == 'dev'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY_IMAGE }}:dev" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:dev"
