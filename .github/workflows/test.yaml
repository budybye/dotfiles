#          orb create ubuntu orb-dev -c cloud-init/orbstack.yaml
#          orb -m orb-dev cloud-init status --wait
#          orb -m orb-dev uname -a
#      - name: Cleanup OrbStack machine
#        if: always()
#        run: orb delete orb-dev || true

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MinoruSekine/setup-scoop@v5.0.1
        with:
          buckets: extras
          apps: curl make git

  windows-11-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      # - name: Install winget
      # - uses: Cyberboss/install-winget@v1
      # - name: Install winget
      #   run: |
      #     winget install Microsoft.PowerToys

  wsl2:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

  lxd:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: latest/edge

      - name: Launch container
        run: |
          lxc profile create dev && \
          cat cloud-init/lxd.yaml | lxc profile edit dev
          lxc launch ubuntu:26.04 ubuntu -p default -p dev
          lxc exec ubuntu -- cloud-init status --wait || true
          lxc exec ubuntu -- tail -8 /var/log/cloud-init.log
          lxc exec ubuntu -- cat /home/budybye/.ssh/authorized_keys || true
          lxc exec ubuntu -- ls -la /home/budybye/dotfiles
          lxc exec ubuntu -- sh -c 'echo "$SHELL"'
          lxc exec ubuntu -- cat /etc/os-release
          lxc config set core.https_address :8443

  rpi:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: latest/edge

      - name: Launch container
        run: |
          lxc launch ubuntu:26.04 rpi --config=user.user-data="$(cat cloud-init/user-data)"
          lxc exec rpi -- cloud-init status --wait || true
          lxc exec rpi -- tail -8 /var/log/cloud-init.log
          lxc exec rpi -- cat /etc/os-release
          lxc config set core.https_address :8443

