name: Run Test install dotfiles
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-amd64:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    steps:
      # 容量が厳しいのでクリーンアップ
      - name: clean space
        run: |
          df -h
          docker image prune --all --force || true
          # /opt/* は消さない。image 20261025 以降、runner の Node (externals/node24) が
          # /opt/runner-cache への symlink で、消すと actions/checkout が起動できなくなる
          sudo rm -rf /opt/az /opt/google /opt/microsoft /opt/pipx /opt/pipx_bin || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf $AGENT_TOOLSDIRECTORY || true
          sudo apt purge -y \
            ansible* \
            aria2* \
            aspnetcore* \
            apache2* \
            azure-cli* \
            cabal* \
            clang* \
            dotnet-* \
            firefox* \
            gfortran-* \
            ghc* \
            google-chrome-stable* \
            google-cloud-sdk* \
            imagemagick* \
            javascript* \
            kubectl* \
            llvm* \
            mono* \
            moby* \
            mysql* \
            nginx* \
            node* \
            npm* \
            nuget* \
            php* \
            postgresql* \
            powershell* \
            rpm* \
            ruby* \
            sqlite3* \
            subversion \
            temurin* \
            tmux* \
            vim* \
            yarn* || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get autoclean -y >/dev/null 2>&1 || true
          df -h
      - uses: actions/checkout@v7
      - name: make
        run: |
          rc=0
          make init || rc=$?
          . .github/scripts/release-step-stdout.sh
          if [ -n "${leaked:-}" ] && [ "${rc}" -eq 0 ]; then
            rc=1
          fi
          exit "${rc}"

  ubuntu-arm64:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: make
        run: |
          rc=0
          make init || rc=$?
          . .github/scripts/release-step-stdout.sh
          if [ -n "${leaked:-}" ] && [ "${rc}" -eq 0 ]; then
            rc=1
          fi
          exit "${rc}"

  # 最小構成の Debian(git・curl・sudo が無い root)から make init が通ることの確認。
  # job container ではなく docker run にするのは、act でも同じ手順で動かすため
  debian:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    steps:
      # act ではホストの docker に対して prune が走るため(ホストのイメージが消える)実行しない
      - name: clean space
        if: ${{ !env.ACT }}
        run: |
          df -h
          docker image prune --all --force || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h
      - uses: actions/checkout@v7
      - name: make init on debian:trixie-slim
        run: |
          docker run --rm \
            -e GITHUB_ACTIONS -e MISE_GITHUB_TOKEN \
            -v "${PWD}:/src" -w /src \
            debian:trixie-slim \
            bash -c 'apt-get update -qq && apt-get install -y -qq git make ca-certificates && make init'

  darwin:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: make
        run: make init

