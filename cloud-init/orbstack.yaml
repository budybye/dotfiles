#cloud-config
# OrbStack local Linux machine: CLI-first, without xrdp/desktop packages.
# Create with: orb create ubuntu orb-dev -c cloud-init/orbstack.yaml
#          or: orb create debian:trixie orb-dev -c cloud-init/orbstack.yaml
# Works on Ubuntu and Debian 12/13 (distro-agnostic package list; locale via runcmd).
# Enter with:  orb -m orb-dev

hostname: orb-dev
manage_etc_hosts: true
timezone: Asia/Tokyo

package_update: true
package_upgrade: true
package_reboot_if_required: false

# Keep this list small. The repository's full Linux bootstrap is intentionally
# not invoked here because it installs the GUI profile as well.
packages:
  - ca-certificates
  - curl
  - git
  - gh
  - gnupg
  - jq
  - age
  - make
  - build-essential
  - pkg-config
  - libssl-dev
  - zsh
  - tmux
  - vim
  - ripgrep
  - fd-find
  - fzf
  - unzip
  - sudo
  - locales

# `locale:` and language-pack-ja are Ubuntu-only; generate ja_JP the same way everywhere.
runcmd:
  - [sh, -c, "grep -q '^ja_JP.UTF-8 UTF-8' /etc/locale.gen || echo 'ja_JP.UTF-8 UTF-8' >> /etc/locale.gen"]
  - [locale-gen]
  - [update-locale, LANG=ja_JP.UTF-8]

# OrbStack provides machine access; do not enable password-based SSH login.
ssh_pwauth: false

final_message: |
  OrbStack cloud-init finished.
  Use `orb -m orb-dev` to enter the machine.
