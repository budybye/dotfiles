name: ubuntu
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: ubuntu
    hostname: container
    privileged: true
    # platform: linux/${ARCH:-$(dpkg --print-architecture || uname -m)}
    ports:
      - "127.0.0.1:${RDP_PORT:-33389}:3389" # localhost RDP
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    # volumes:
    #   - ${HOME}/Developer:/home/ubuntu/Developer
    # environment:
      # REMOTE_CONTAINERS: true
      # MISE_GITHUB_TOKEN: ${MISE_GITHUB_TOKEN:-}
    shm_size: 512m # ブラウザ対策
    # Local-only convenience default; ports are loopback-bound.
    command: ["ubuntu", "${PASSWORD:-ubuntu}", "yes"]
    tty: true
    restart: always

  # rdp,ssh はzerotrustで設定するとできる
  # tunnel:
  #   image: cloudflare/cloudflared
  #   command: tunnel --url ${TUNNEL_URL:-http://ubuntu:3389}
  #   command: tunnel run --token ${TUNNEL_TOKEN:-}
  #   restart: unless-stopped
  # extra_hosts: ["host.docker.internal:host-gateway"]

secrets:
  github_token:
    environment: GITHUB_TOKEN