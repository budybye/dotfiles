name: dev
services:
  ubuntu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntu
    hostname: docker
    privileged: true
    platform: linux/${ARCH:-$(dpkg --print-architecture || uname -m)}
    ports:
      - ${RDP_PORT:-33389}:3389 # 127.1:33389 で RDP
      - ${SSH_PORT:-2222}:22
    # volumes:
    #   - ${HOME}/Developer:/home/${USER:-ubuntu}/Developer
    environment:
      # REMOTE_CONTAINERS: true
      MISE_GITHUB_TOKEN: ${MISE_GITHUB_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    shm_size: 512m # ブラウザ対策
    # entrypoint: ["entrypoint"]
    command: ["ubuntu", "ubuntu", "yes"]
    tty: true
    restart: always

  # rdp,ssh はzerotrustで設定するとできる
  # tunnel:
  #   image: cloudflare/cloudflared
  #   command: tunnel --url ${TUNNEL_URL:-http://ubuntu:3389}
  #   command: tunnel run --token ${TUNNEL_TOKEN:-}
  #   restart: unless-stopped
  # extra_hosts: ["host.docker.internal:host-gateway"]
  
secrets:
  github_token:
    environment: GITHUB_TOKEN